name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/audit-release.mjs --self-test
      - run: npm run build
      - name: Preserve distribution licenses
        run: cp LICENSE THIRD_PARTY_NOTICES.md dist/
      - run: npm run audit:release -- --require-dist
